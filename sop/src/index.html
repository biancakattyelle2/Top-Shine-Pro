<style>
.picker { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 14px; margin-bottom: 20px; }
.pick-row { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; align-items: start; }
.pick-row > span { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding-top: 8px; }
.chips2 { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 14px; font-weight: 700; color: var(--ink); cursor: pointer; }
.chip:hover { border-color: var(--brand); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip small { font-weight: 600; opacity: .8; margin-left: 4px; font-size: 11px; letter-spacing: .04em; }
.sendbar { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.sendbar b { display: block; font-size: 14px; }
.sendbar code { display: block; font-size: 13px; color: var(--accent); overflow-wrap: anywhere; user-select: all; }
.sendbar small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.sendbar a, .sendbar button, .all-links button { font: inherit; font-size: 13px; font-weight: 700; border-radius: 8px; padding: 8px 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; cursor: pointer; white-space: nowrap; }
.sendbar button.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
details.all-links { margin-top: 2px; }
details.all-links summary { cursor: pointer; font-weight: 700; color: var(--accent); font-size: 14px; }
.all-links table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
.all-links td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.all-links td:last-child { text-align: right; white-space: nowrap; }
.hub-title { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.hub-title img { width: 64px; height: auto; background: #ffffff; border-radius: 12px; padding: 5px; border: 1px solid var(--line); }
.hub-title h1 { font-size: clamp(26px, 4vw, 36px); }
.hub-title p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
@media (max-width: 860px) {
  .pick-row { grid-template-columns: 1fr; gap: 6px; }
  .pick-row > span { padding-top: 0; }
  .sendbar { grid-template-columns: 1fr 1fr; }
  .sendbar > div { grid-column: 1 / -1; }
}
</style>
<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <span class="brand-mark" id="mark"></span>
      <span><b id="pname"></b><small>Top&amp;Shine · <span id="plabel"></span></small></span>
    </div>
    <div class="langs" id="langs" role="group" aria-label="Language"></div>
  </div>
</header>
<div class="wrap" style="padding-bottom:0">
  <div class="hub-title"><img id="logo" alt="Top&amp;Shine logo"><div><h1>Tipos de Limpezas / SOP's</h1><p>Veja tudo aqui mesmo. Para mandar, copie o link da página certa.</p></div></div>
  <section class="picker" id="picker"></section>
</div>
<main class="wrap" id="app" style="padding-top:0"></main>
<script>
/*COMMON*/
/*ENGINE*/
/*ENTRIES*/
const LOGO = /*LOGO*/;
const LINKS = /*LINKS*/;
const HUB = {
  services: [["regular", "Regular"], ["deluxe", "Deluxe"], ["move", "Move In/Out"], ["airbnb", "Airbnb"], ["post", "Pós-obra"], ["commercial", "Comercial pequeno"], ["trainer", "Treinamento"]],
  aud: { cleaner: ["Cleaner", "EN · PT · ES"], client: ["Cliente", "EN"] },
  who: { cleaner: "a cleaner", client: "o cliente", trainer: "a treinadora ou VA" }
};
let hubSvc = "regular", hubAud = "cleaner";
try { const v = JSON.parse(localStorage.getItem("tsp:hub") || "null"); if (v && v.svc) { hubSvc = v.svc; hubAud = v.aud || "cleaner"; } } catch (e) {}
const hubKey = () => hubSvc === "trainer" ? "trainer" : hubSvc + "-" + hubAud;
const pageName = k => { const p = ENTRIES[k].page; return (p.name.pt || p.name.en) + " · " + (p.label.pt || p.label.en); };

function renderPicker() {
  const key = hubKey(), url = LINKS[key] || "", who = HUB.who[hubSvc === "trainer" ? "trainer" : hubAud];
  document.getElementById("picker").innerHTML = `
    <div class="pick-row"><span>Tipo de limpeza</span><div class="chips2">${HUB.services.map(([k, n]) => `<button class="chip" type="button" data-hsvc="${k}" aria-pressed="${hubSvc === k}">${n}</button>`).join("")}</div></div>
    ${hubSvc === "trainer" ? "" : `<div class="pick-row"><span>Para quem</span><div class="chips2">${Object.entries(HUB.aud).map(([k, [n, l]]) => `<button class="chip" type="button" data-haud="${k}" aria-pressed="${hubAud === k}">${n}<small>${l}</small></button>`).join("")}</div></div>`}
    <div class="sendbar">
      <div><b>Link para mandar para ${who}</b>${url ? `<code>${esc(url)}</code><small>Quem abrir este link vê só esta página. Libere o acesso no menu Share da página.</small>` : `<small>Ainda não publicado.</small>`}</div>
      ${url ? `<button class="main" type="button" data-hlink="${esc(url)}">Copiar link</button><a href="${esc(url)}" target="_blank" rel="noopener">Abrir sozinha</a>` : ""}
    </div>
    <details class="all-links"><summary>Ver todos os links</summary><table>${Object.keys(ENTRIES).map(k => `<tr><td>${esc(pageName(k))}</td><td>${LINKS[k] ? `<button type="button" data-hlink="${esc(LINKS[k])}">Copiar link</button>` : "—"}</td></tr>`).join("")}</table></details>`;
}
function hubShow() {
  try { localStorage.setItem("tsp:hub", JSON.stringify({ svc: hubSvc, aud: hubAud })); } catch (e) {}
  renderPicker();
  loadPage(ENTRIES[hubKey()]);
}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.hsvc) { hubSvc = b.dataset.hsvc; return hubShow(); }
  if (b.dataset.haud) { hubAud = b.dataset.haud; return hubShow(); }
  if (b.dataset.hlink) {
    const url = b.dataset.hlink, old = b.textContent;
    const done = () => { b.textContent = "Copiado ✓"; setTimeout(() => { b.textContent = old; }, 1600); };
    try { navigator.clipboard.writeText(url).then(done, () => { b.textContent = url; }); } catch (err) { b.textContent = url; }
  }
});
document.getElementById("mark").innerHTML = `<img src="${LOGO}" alt="" style="width:30px">`;
document.getElementById("logo").src = LOGO;
hubShow();
</script>
